# Shared by the migration and the seed Jobs, which reach Postgres and the api over HTTP and
# never the Kubernetes API: no token is mounted. It is a hook of its own so it exists before the
# migration Job's pod does, on a first install; it is replaced on every install and upgrade.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "floor.hooks.serviceAccountName" . }}
  labels:
    {{- include "floor.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false

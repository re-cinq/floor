{{/*
Templated from deploy/agent-subsystem/controller.yaml, the ai-agent-subsystem's controller
vendored at v0.11.8: same RBAC and Deployment shape, __NAMESPACE__/__CONTROLLER_IMAGE__/
__AGENT_IMAGE__ replaced with chart values instead of scripts/setup-minikube-agents.sh's sed.
*/}}
{{- if .Values.subsystem.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floor.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["stations", "agentdefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-controller
subjects:
  - kind: ServiceAccount
    name: agent-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: {{ .Release.Namespace }}
  labels:
    agents.re-cinq.com/component: controller
    {{- include "floor.labels" . | nindent 4 }}
spec:
  # One replica: the same single-controller-per-namespace shape as the vendored manifest.
  replicas: 1
  selector:
    matchLabels:
      agents.re-cinq.com/component: controller
  template:
    metadata:
      labels:
        agents.re-cinq.com/component: controller
    spec:
      serviceAccountName: agent-controller
      {{- include "floor.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ .Values.subsystem.controllerImage }}:{{ .Values.subsystem.version }}
          imagePullPolicy: IfNotPresent
          env:
            # The controller reconciles this namespace only, which is what lets it
            # sit beside another install of the subsystem on the same cluster.
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEALTH_PORT
              value: "8081"
            - name: AGENT_IMAGE
              value: {{ .Values.subsystem.agentImage }}:{{ .Values.subsystem.version }}
            - name: MAX_OUTPUT_BYTES
              value: "262144"
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              # The upstream 128Mi OOM-killed lore's controller once Agent resources piled up; see lore's chart.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}

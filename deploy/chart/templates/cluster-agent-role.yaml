{{- if .Values.clusterAgent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "floor.clusterAgent.fullname" . }}
  namespace: {{ include "floor.agentsNamespace" . }}
  labels:
    {{- include "floor.clusterAgent.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents", "stations", "agentdefinitions"]
    # list: the sweep that removes the recipes no Agent runs any more. watch, patch: an agent
    # definition's recipes are pushed ahead of any visit and marked, and a hand edit to one is
    # seen and reported to the floor.
    verbs: ["create", "delete", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-secrets"]
    verbs: ["get", "update"]
{{- end }}

{{- if .Values.clusterAgent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "floor.clusterAgent.fullname" . }}
  labels:
    {{- include "floor.clusterAgent.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "floor.clusterAgent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "floor.clusterAgent.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.clusterAgent.enabled }}
{{- if not (lookup "v1" "Secret" .Release.Namespace "agent-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floor.labels" . | nindent 4 }}
  annotations:
    # The cluster agent adds keys to this Secret as it runs (per-visit tokens, model API keys).
    # Created empty the first time; never re-templated once it exists, so an upgrade never
    # overwrites what the agent has written.
    helm.sh/resource-policy: keep
type: Opaque
data: {}
{{- end }}
{{- end }}

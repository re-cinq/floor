{{- if .Values.clusterAgent.enabled }}
# Read-only on the one ConfigMap the ai-agent-subsystem's chart publishes with its release and CLI
# pins, in the namespace it runs in; the cluster agent sends them to the floor on every register.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "floor.clusterAgent.fullname" . }}-subsystem-versions
  namespace: {{ include "floor.subsystemNamespace" . }}
  labels:
    {{- include "floor.clusterAgent.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["agent-subsystem-versions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "floor.clusterAgent.fullname" . }}-subsystem-versions
  namespace: {{ include "floor.subsystemNamespace" . }}
  labels:
    {{- include "floor.clusterAgent.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "floor.clusterAgent.fullname" . }}-subsystem-versions
subjects:
  - kind: ServiceAccount
    name: {{ include "floor.clusterAgent.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

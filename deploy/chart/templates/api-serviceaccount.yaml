{{- if .Values.api.enabled }}
# The api talks to Postgres and to HTTP peers, never to the Kubernetes API: no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "floor.api.serviceAccountName" . }}
  labels:
    {{- include "floor.api.selectorLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

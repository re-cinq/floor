{{- if .Values.github.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "floor.github.fullname" . }}
  labels:
    {{- include "floor.github.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "floor.github.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "floor.github.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "floor.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github
          image: {{ include "floor.image" . }}
          command: ["node", "apps/github/dist/index.js"]
          ports:
            - name: http
              containerPort: {{ .Values.github.service.port }}
          env:
            - name: PORT
              value: {{ .Values.github.service.port | quote }}
            - name: FLOOR_API_URL
              value: "http://{{ include "floor.api.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8080"
            - name: FLOOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: serviceToken
            {{- if .Values.github.apiUrl }}
            - name: GITHUB_API_URL
              value: {{ .Values.github.apiUrl | quote }}
            {{- end }}
            {{- if .Values.github.reviewRouter }}
            - name: GITHUB_REVIEW_ROUTER
              value: "1"
            {{- end }}
            {{- if .Values.github.gitCredentials }}
            - name: GITHUB_GIT_CREDENTIALS
              value: "1"
            {{- end }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: webhookSecret
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: token
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: appId
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: appPrivateKey
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}

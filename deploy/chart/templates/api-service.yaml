{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "floor.api.fullname" . }}
  labels:
    {{- include "floor.api.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "floor.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}

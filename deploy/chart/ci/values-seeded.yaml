# helm template floor . -f ci/values-seeded.yaml — both apps enabled, and a ConfigMap of pipelines seeded.
version: "test"

api:
  enabled: true
  baseUrl: http://floor-api.floor.svc.cluster.local
  existingSecret: floor-api-secret

clusterAgent:
  enabled: true

postgres:
  existingSecret: floor-postgres-secret
  secretKey: connectionString

pipelines:
  existingConfigMap: floor-pipelines

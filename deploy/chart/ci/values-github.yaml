# helm template floor . -f ci/values-github.yaml — github enabled alongside the api.
version: "test"

api:
  enabled: true
  baseUrl: http://floor-api.floor.svc.cluster.local
  existingSecret: floor-api-secret

clusterAgent:
  enabled: false

github:
  enabled: true
  existingSecret: floor-github-secret

postgres:
  existingSecret: floor-postgres-secret
  secretKey: connectionString

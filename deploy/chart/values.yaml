# The image tag for both apps. One value, never one per app: the api and cluster-agent images
# are always built and released together from this repo's own Dockerfile.
version: ""

image:
  repository: ghcr.io/re-cinq/floor

# Pulled by every Deployment this chart renders (api, cluster agent, and the subsystem controller
# when enabled). A list of { name: <secret-name> }, as Kubernetes expects.
imagePullSecrets: []

api:
  enabled: true
  # Every replica serves. The loop runs on the one holding the floor's lease, and another takes
  # it over when that one goes; GET /version on a replica says whether it is the one.
  replicas: 2
  # The address pods reach floor at (FLOOR_BASE_URL) — required when api.enabled.
  baseUrl: ""
  # A Secret holding keys "serviceToken" and "visitTokenSecret". Read by the api Deployment
  # (FLOOR_SERVICE_TOKEN, FLOOR_VISIT_TOKEN_SECRET) and by the cluster agent, which authenticates
  # to the api with the same service token (FLOOR_CLUSTER_AGENT_TOKEN).
  existingSecret: ""
  # FLOOR_REAP_MS — optional override of the api's own default reap interval.
  reapMs: ""
  # FLOOR_GIT_CREDENTIAL_URL — where the api asks for a git credential for a visit's repository.
  # The provider is a service outside this chart, which mints a credential for one repository when
  # asked. Empty means nothing does: a visit that would write to a repository is not dispatched.
  gitCredentialUrl: ""
  # FLOOR_GIT_CREDENTIAL_TOKEN — the token the api presents to that provider. It is never the
  # service token. Read from `key` of Secret `name`; an empty name falls back to existingSecret.
  # Needed only when gitCredentialUrl is set.
  gitCredentialSecret:
    name: ""
    key: gitCredentialToken

clusterAgent:
  enabled: true
  # Defaults to the in-cluster api Service when api.enabled; required when api.enabled is false.
  floorUrl: ""
  tags: "kind:agent"
  # "claude=CLAUDE_CODE_OAUTH_TOKEN,gemini=GEMINI_API_KEY" — overrides which secret key in
  # agent-secrets holds each model family's credential. Optional; the agent has its own defaults.
  modelSecretKeys: ""

# What an agent's pod may reach: the cluster's DNS, the public internet on 443, and this release's
# api. Nothing reaches the pod. Rendered when clusterAgent.enabled, in the release's namespace,
# where the cluster agent runs its agents. It binds only where the cluster's network plugin
# enforces NetworkPolicy; where it does not, it is accepted and does nothing.
agentNetworkPolicy:
  enabled: true
  # Where NodeLocal DNSCache answers, which is a link-local address on the node and not the
  # cluster's DNS service. GKE and most others use 169.254.20.10. Empty allows only the cluster's
  # DNS pods, which is right only for a cluster that does not run NodeLocal DNSCache.
  nodeLocalDnsAddress: "169.254.20.10"
  # More places a pod may reach, as NetworkPolicy egress rules, added as they are written:
  # lore's MCP gateway and skills registry, a floor in another namespace or outside the cluster
  # (api.enabled false, or an api.baseUrl on a private address), a proxy.
  #   - to:
  #       - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: lore } }
  #         podSelector: { matchLabels: { app: mcp-gateway } }
  #     ports:
  #       - { protocol: TCP, port: 8080 }
  extraEgress: []

# Pipelines seeded into the floor at every install and upgrade, by a post-install,post-upgrade Job
# that runs `floor-pipeline migrate` against the api. Empty means no Job; it also needs api.enabled.
# existingConfigMap names a ConfigMap you keep: one YAML file a pipeline, and the names are the
# order they run in (0001-code-review.yaml, 0002-...). Each file runs once, and the floor
# remembers which did. A file changed after it ran FAILS the Job, and so the upgrade, by design:
# what it did is done, and a change is a new file. A ConfigMap holds at most 1 MiB.
pipelines:
  existingConfigMap: ""

postgres:
  # Either set existingSecret + secretKey (a Secret holding a full connection string under that
  # key), or the host/port/database/user/password below, from which the chart builds one.
  existingSecret: ""
  secretKey: ""
  host: ""
  port: 5432
  database: ""
  user: ""
  password: ""

# The ai-agent-subsystem's controller (deploy/agent-subsystem/controller.yaml) and its CRDs. Off
# by default: a floor can share a subsystem another install already put on the cluster.
subsystem:
  enabled: false
  version: v0.11.10
  # The only versions this chart knows how to deploy today; add to this list as the chart is
  # updated for a newer vendored controller.yaml.
  supportedVersions:
    - v0.11.6
    - v0.11.8
    - v0.11.9
    - v0.11.10
  controllerImage: ghcr.io/re-cinq/ai-agent-controller
  agentImage: ghcr.io/re-cinq/ai-agent

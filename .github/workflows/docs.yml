name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'examples/code/hello/**'
      - 'examples/code/client/**'
      - 'examples/code/contracts/**'
      - 'packages/station/**'
      - 'packages/pipeline/**'
      - 'examples/code/pipeline/**'
      - 'packages/client/**'
      - 'packages/contracts/**'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build SDK dependencies and test the station example
        run: |
          npm ci --ignore-scripts
          npm run build -w @re-cinq/floor-contracts
          npm run build -w @re-cinq/floor-client
          npm test -w @re-cinq/floor-station
      - name: Build with Astro
        uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26 # v6
        with:
          path: ./website
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

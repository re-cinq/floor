name: Build and push floor

# One image, both apps. Which one a container runs is chosen at deploy time by
# overriding `command`, so there is never a version skew between them.
# A push to main publishes the short SHA and `latest`; a tag `v1.2.3` publishes `1.2.3` and `1.2`.
# Path filters are not applied to a tag, so a tag always builds. Both are deployed: a commit to
# main by its short SHA, a tag by its version.
on:
  push:
    branches: [main]
    # A version and nothing else: a tag `vnext` would publish no version, and deploy an image that is not there.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "deploy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/floor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.deployed.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5

      # What the deploy installs: the version for a tag `v1.2.3`, as the image is tagged `1.2.3`;
      # the short SHA for anything else.
      - name: The tag to deploy
        id: deployed
        run: |
          image_tag="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then image_tag="${GITHUB_REF_NAME#v}"; fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      # The default docker driver cannot export a build cache; buildx's own can.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FLOOR_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Skipped until the repository names a cluster: publishing the image does not wait for one.
  # A commit to main and a version tag deploy into the same release, so the one that ran last is
  # what serves. They run one after the other, never at once: helm refuses a second upgrade of a
  # release while the first is under way.
  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.GKE_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-floor
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation trades for GCP credentials

    steps:
      - uses: actions/checkout@v5

      # The same Workload Identity Federation setup lore uses: no service-account key
      # is stored anywhere, the run's OIDC token is traded for a short-lived credential.
      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION || 'europe-west1' }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # One chart, one image, one `version` — the api and the cluster agent roll together.
      #
      # `--wait` is safe here: every api replica that reaches Postgres is ready, and the
      # loop runs on whichever holds the Postgres lease. It was not always so — when
      # /readyz meant "holds the lease" a second replica was never ready and --wait sat
      # there until it timed out. See deploy/chart/README.md, "Verified on a cluster".
      #
      # The migration Job is part of the release, so --wait also waits for the schema.
      - name: Deploy
        run: |
          helm upgrade --install floor deploy/chart \
            --namespace "${{ vars.FLOOR_NAMESPACE || 'floor' }}" --create-namespace \
            --set version="${{ needs.build.outputs.image_tag }}" \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set imagePullSecrets[0].name="${{ vars.FLOOR_PULL_SECRET || 'ghcr' }}" \
            --set api.baseUrl="${{ vars.FLOOR_BASE_URL }}" \
            --set api.existingSecret="${{ vars.FLOOR_API_SECRET || 'floor-api' }}" \
            --set postgres.existingSecret="${{ vars.FLOOR_POSTGRES_SECRET || 'floor-postgres' }}" \
            --set postgres.secretKey="${{ vars.FLOOR_POSTGRES_SECRET_KEY || 'connectionString' }}" \
            --set subsystem.enabled=true \
            --wait --timeout 10m

      # A rollout can report success while the old pods still serve. /version says which
      # image answered and whether that replica holds the loop's lease.
      - name: What is serving
        run: |
          namespace="${{ vars.FLOOR_NAMESPACE || 'floor' }}"
          kubectl -n "${namespace}" rollout status deployment/floor-api --timeout=5m
          kubectl -n "${namespace}" rollout status deployment/floor-cluster-agent --timeout=5m
          kubectl -n "${namespace}" get pods -l app.kubernetes.io/name=floor -o wide

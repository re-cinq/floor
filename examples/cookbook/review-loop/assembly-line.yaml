# yaml-language-server: $schema=https://re-cinq.github.io/floor/schemas/pipeline.schema.json
line:
  id: review-loop
  entry: write
  exit: done
  fail: abandoned
  args:
    topic:
      kind: value
      subject: true
  nodes:
    - id: write
      station: draft-writer
      bind:
        feedback: review_feedback
    - id: review
      station: reviewer
    - id: done
    - id: abandoned
  edges:
    - from: write
      to: review
      on: success
    - from: write
      to: abandoned
      on: failed
    - from: review
      to: done
      on: approved
    - from: review
      to: write
      on: changes_requested
      iteration_max: 3
stations:
  draft-writer:
    description: An agent drafts a short text about the topic and addresses the reviewer's feedback.
    kind: agent
    agent_definition: draft-writer
    outcomes:
      - success
      - failed
    needs:
      - name: topic
        kind: value
      - name: feedback
        kind: value
        optional: true
        fresh: true
    produces:
      - name: draft
        kind: file
        path: draft.md
  reviewer:
    description: A person reads the draft and approves it or asks for changes.
    kind: human
    outcomes:
      - approved
      - changes_requested
    needs:
      - name: draft
        kind: file
    produces:
      - name: review_feedback
        kind: value

run:
  # {selector} is the native vitest test id: "<file> > <full test name>"
  # Split on the first " > " to get the file path and test name filter.
  command: >
    npx vitest run
    --reporter=json
    --coverage
    --coverage.provider=v8
    --coverage.reporter=lcov
    --coverage.reportsDirectory=./coverage
    -t {selector}
